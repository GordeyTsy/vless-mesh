version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meshdb}
      POSTGRES_USER: ${POSTGRES_USER:-mesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meshpass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mesh} -d ${POSTGRES_DB:-meshdb}"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mesh}:${POSTGRES_PASSWORD:-meshpass}@db:5432/${POSTGRES_DB:-meshdb}
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_PASSWORD: admin
      DJANGO_SUPERUSER_EMAIL: admin@example.com
    ports:
      - "8001:8001"
    command: ["/bin/sh", "-c", "python manage.py migrate && gunicorn --workers=3 --bind 0.0.0.0:8001 meshbackend.wsgi:application"]
    working_dir: /app/backend
    volumes:
      - .:/app

volumes:
  pgdata:
